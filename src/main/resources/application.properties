spring.application.name=gestion_comercial

# lee DB_USER y DB_PASSWORD del archivo .env (el mismo que usa Docker)
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:5433/gestiondb
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# cierra la conexión con la BD al terminar la consulta, no al terminar la respuesta
spring.jpa.open-in-view=false
